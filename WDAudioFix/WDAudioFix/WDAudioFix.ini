[Fix]
; Make a device report a plain PCM format and speaker layout to the game.
; Matches any device whose name contains this text (not case-sensitive).
; Leave empty to turn off.
FakeDevice=Digital Output
FakeChannels=2
FakeBits=24

; Let Windows resample/remix any shared-mode stream to the device's format.
AutoConvert=1

; Report a plain float mix format to the game instead of the real one.
ForceMixFormat=1
ForceRate=48000
ForceChannels=2

; Remove RAW / offload stream options, which bypass driver effects such as
; Dolby Digital Live and DTS Interactive encoders.
StripRawMode=1

[Log]
; Once per second per stream: how much audio the game wrote and how loud it was.
RenderStats=1
; Which device properties the game reads, and what the plugin changes.
DeviceProperties=1
